<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Home Server · Server Room</title>
  <style>
    :root { --ink: #2b2723; --sub: #7a7168; --card: rgba(255, 252, 247, 0.9); --line: rgba(60, 45, 30, 0.10);
      --bg: #eee8df; --track: rgba(60, 45, 30, 0.10); --hover: rgba(60, 45, 30, 0.05); --accent: #b07a3e; }
    body.night { --ink: #ece6dd; --sub: #a49a8e; --card: rgba(22, 26, 40, 0.88); --line: rgba(255, 255, 255, 0.08);
      --bg: #1a2340; --track: rgba(255, 255, 255, 0.10); --hover: rgba(255, 255, 255, 0.05); --accent: #f0b46a; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink);
      font: 14px/1.4 system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif; transition: background .3s; }
    #app { display: grid; grid-template-columns: minmax(0, 1fr) 340px; height: 100%; }
    #stage { position: relative; min-width: 0; min-height: 0; }
    #stage canvas { display: block; touch-action: none; }
    #panel { margin: 16px 16px 16px 0; padding: 18px; border-radius: 16px; background: var(--card);
      backdrop-filter: blur(10px); box-shadow: 0 6px 24px rgba(0,0,0,.08); overflow-y: auto; }
    header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    h1 { margin: 0; font-size: 18px; font-weight: 680; letter-spacing: .01em; }
    h2 { margin: 18px 0 8px; font-size: 13px; font-weight: 650; display: flex; justify-content: space-between; }
    h2 span { color: var(--sub); font-weight: 500; }
    .sub { color: var(--sub); font-size: 12px; }
    .btn { border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; background: transparent;
      color: var(--ink); font: inherit; font-size: 12px; cursor: pointer; white-space: nowrap; }
    .btn:hover { background: var(--hover); }
    .overall { margin-top: 10px; font-size: 12px; color: var(--sub); display: flex; align-items: center; gap: 6px; }
    .overall b { color: var(--ink); font-weight: 600; }
    .metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; }
    .metric { padding: 10px; border-radius: 12px; border: 1px solid var(--line); }
    .metric .k { font-size: 11px; color: var(--sub); }
    .metric .v { font-size: 20px; font-weight: 650; margin: 2px 0 6px; font-variant-numeric: tabular-nums; }
    .bar { height: 4px; border-radius: 4px; background: var(--track); overflow: hidden; }
    .bar i { display: block; height: 100%; background: var(--accent); border-radius: 4px; transition: width .4s; }
    ul { list-style: none; margin: 0; padding: 0; }
    .svc { border-radius: 10px; padding: 7px 8px; cursor: pointer; }
    .svc:hover { background: var(--hover); }
    .svc.sel { background: var(--hover); box-shadow: inset 0 0 0 1px var(--line); }
    .svc .row1 { display: flex; align-items: center; gap: 8px; }
    .svc .name { flex: 1; font-weight: 560; font-size: 13px; }
    .svc .count { color: var(--sub); font-size: 12px; font-variant-numeric: tabular-nums; }
    .svc .kids { margin: 6px 0 2px 16px; display: grid; gap: 3px; font-size: 12px; }
    .svc .kids div { display: flex; gap: 6px; align-items: center; }
    .svc .kids span { color: var(--sub); margin-left: auto; }
    .ext { display: flex; gap: 8px; flex-wrap: wrap; font-size: 12px; color: var(--sub); }
    .ext span { border: 1px solid var(--line); border-radius: 999px; padding: 3px 9px; }
    .ext .link { cursor: pointer; color: var(--ink); }
    .ext .link:hover { background: var(--hover); }
    .chart { margin-top: 10px; }
    .chart-h { display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; color: var(--sub); }
    .chart-h b { font-size: 13px; font-weight: 650; font-variant-numeric: tabular-nums; }
    .chart svg { display: block; width: 100%; height: 64px; margin-top: 4px; border-radius: 6px; background: var(--hover); }
    .chart .grid { stroke: var(--line); stroke-width: 1; vector-effect: non-scaling-stroke; }
    .chart-x { display: flex; justify-content: space-between; font-size: 10px; color: var(--sub); margin-top: 2px; }
    .legend { display: flex; gap: 10px; flex-wrap: wrap; font-size: 11px; color: var(--sub); margin-top: 16px; }
    .legend span { display: flex; align-items: center; gap: 4px; }
    .note { font-size: 11px; color: var(--sub); margin-top: 10px; }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; flex: none; }
    .ok { background: #4cd97a; } .warn { background: #ff9f2e; } .error { background: #ff3b2f; } .unknown { background: #8a8d91; }
    .tip { position: fixed; pointer-events: none; padding: 8px 10px; border-radius: 10px; background: var(--card);
      backdrop-filter: blur(8px); font-size: 12px; box-shadow: 0 4px 16px rgba(0,0,0,.12); display: none; min-width: 150px; z-index: 5; }
    .tip b { display: flex; gap: 6px; align-items: center; font-size: 13px; margin-bottom: 4px; }
    .tip .row { white-space: nowrap; display: flex; gap: 6px; align-items: center; }
    .tip .muted { color: var(--sub); }
    #tags { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
    .tag { position: absolute; transform: translateY(-50%); display: flex; align-items: center; gap: 6px;
      padding: 3px 8px 3px 6px; border-radius: 8px; background: var(--card); font-size: 11px; white-space: nowrap;
      box-shadow: 0 2px 8px rgba(0,0,0,.12); opacity: 0; transition: opacity .25s; cursor: pointer; }
    .tag::before { content: ""; position: absolute; left: -14px; top: 50%; width: 14px; border-top: 1px solid var(--sub); opacity: .6; }
    .tag.show { opacity: 1; pointer-events: auto; }
    .tag.sel { box-shadow: 0 0 0 1.5px var(--accent), 0 2px 8px rgba(0,0,0,.12); }
    .tag b { font-weight: 640; }
    #back { position: absolute; left: 16px; top: 16px; display: none; background: var(--card); backdrop-filter: blur(8px); }
    #back.show { display: block; }
    @media (max-width: 820px) {
      #app { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr) auto; }
      #panel { margin: 0; border-radius: 16px 16px 0 0; max-height: 44vh; padding: 14px 16px; }
      .metric .v { font-size: 17px; }
    }
  </style>
  <script type="importmap">
    { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    } }
  </script>
</head>
<body>
  <div id="app">
    <div id="stage">
      <div id="tags"></div>
      <button class="btn" id="back">← 방 전체</button>
    </div>
    <aside id="panel">
      <header>
        <div>
          <h1 id="title"></h1>
          <div class="sub" id="subtitle"></div>
        </div>
        <button class="btn" id="theme">밤</button>
      </header>
      <div class="overall" id="overall"></div>
      <div class="metrics" id="metrics"></div>
      <section id="charts" hidden>
        <h2>최근 1시간 <span id="charts-src"></span></h2>
        <div id="chart-list"></div>
      </section>
      <h2>서비스 <span id="svc-count"></span></h2>
      <ul id="services"></ul>
      <h2>외부 서비스</h2>
      <div class="ext"><span class="link" id="ext-grafana">Grafana Cloud · 지표</span><span>Sentry · 오류 추적</span></div>
      <div class="legend">
        <span><i class="dot ok"></i>정상</span><span><i class="dot warn"></i>주의</span>
        <span><i class="dot error"></i>오류</span><span><i class="dot unknown"></i>데이터 없음</span>
      </div>
      <div class="note">랙이나 벽 모니터를 누르면 가까이서 볼 수 있어요. 랙 하나가 서버 한 대, LED 하나가 컨테이너 하나입니다.</div>
    </aside>
  </div>
  <div class="tip" id="tip"></div>
  <script type="module" src="main.js"></script>
</body>
</html>
